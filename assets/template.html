<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Azure pricing estimate styles</title>
<style>
  :root{--blue:#0078D4;--navy:#0F1420;--accent:#4EA1FF;--ink:#201F1E;--gray:#605E5C;--line:#E1DFDD;--panel:#F3F2F1;--green:#107C10;--green-bg:#DFF6DD;--amber:#8A6D00;--amber-bg:#FFF8E1;}
  *{box-sizing:border-box;}
  body{font-family:'Segoe UI',Arial,sans-serif;font-size:14px;line-height:1.5;color:var(--ink);background:#fff;margin:0;}
  .top{background:var(--navy);color:#ECF2FC;border-top:4px solid var(--accent);padding:20px 32px 0;}
  h1{font-size:22px;font-weight:600;margin:0 0 8px;overflow-wrap:anywhere;}
  .meta{display:flex;gap:8px 26px;flex-wrap:wrap;font-size:12px;color:#BECBE0;}
  .meta span{color:#fff;font-weight:600;}
  .tabs{display:flex;gap:5px;overflow-x:auto;margin-top:18px;padding-bottom:0;}
  .tab{font:inherit;text-decoration:none;white-space:nowrap;display:block;background:transparent;color:#D2DCEF;padding:10px 16px;border:0;border-bottom:3px solid transparent;}
  .tab[aria-selected="true"]{border-bottom-color:var(--accent);color:#fff;background:#1C2638;}
  .tab:hover{background:#253149;color:#fff;}
  :focus-visible{outline:3px solid var(--accent);outline-offset:3px;}
  .pane,.notices{max-width:1080px;margin:0 auto;padding:24px 40px;}
  .pane{padding-bottom:54px;}
  .notices:empty{display:none;}
  .js body{height:100vh;display:flex;flex-direction:column;}
  .js .top{flex:none;}
  .js #view{flex:1;min-height:0;overflow:auto;}
  .js .pane{display:none;}
  .js .pane.on{display:block;}
  h2{font-size:19px;font-weight:600;margin:0 0 12px;padding-bottom:6px;border-bottom:2px solid var(--line);overflow-wrap:anywhere;}
  h3{font-size:15px;margin:24px 0 8px;}
  p{margin:8px 0 14px;}
  a{color:var(--blue);}
  .table-wrap{overflow-x:auto;margin:12px 0;}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  table.itemization{min-width:680px;}
  .itemization thead th:first-child{width:40%;}
  .itemization thead th:nth-child(3){width:20%;}
  caption{text-align:left;font-weight:600;margin-bottom:8px;}
  th{background:var(--blue);color:#fff;text-align:left;padding:8px 10px;border:1px solid #106EBE;font-weight:600;}
  td{padding:8px 10px;border:1px solid var(--line);vertical-align:top;overflow-wrap:anywhere;}
  tr:nth-child(even) td{background:#FAF9F8;}
  .n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;}
  .c{text-align:center;}
  tr.grp th{background:var(--panel);color:var(--ink);border-color:var(--line);font-size:12px;}
  tr.sub td{background:#EEF6FC;font-weight:600;}
  tr.tot td{background:var(--green-bg);border-top:2px solid var(--green);font-weight:700;}
  .box{border-left:4px solid var(--blue);background:#F5FAFE;padding:12px 16px;margin:12px 0;font-size:13px;}
  .box.warn{border-left-color:var(--amber);background:var(--amber-bg);}
  .box b{display:block;margin-bottom:4px;}
  .src,.muted,.note{font-size:12px;color:var(--gray);}
  .src{display:block;margin-top:6px;overflow-wrap:anywhere;}
  .note{border:1px solid var(--line);background:#FAF9F8;padding:12px 16px;}
  .price{font-size:26px;font-weight:700;color:#005A9E;}
  .price small{font-size:13px;font-weight:400;color:var(--gray);}
  .tight,.next{padding-left:22px;}
  .tight li,.next li{margin-bottom:6px;}
  code{font-family:Consolas,monospace;font-size:.9em;overflow-wrap:anywhere;}
  .foot{max-width:1080px;margin:0 auto;padding:16px 40px;border-top:1px solid var(--line);font-size:11.5px;color:var(--gray);}
  @media(max-width:600px){
    .top{padding:16px 16px 0;} h1{font-size:19px;}
    .pane,.notices{padding:20px 16px;} .foot{padding:16px;}
    th,td{padding:6px;} .tab{padding:10px;}
  }
  @media print{
    .js body{display:block;height:auto;}
    .js #view{overflow:visible;}
    .tabs{display:none;}
    .top{background:#fff;color:#000;border-top-color:var(--blue);padding:0 0 14px;}
    .meta,.meta span{color:#333;}
    .js .pane,.pane{display:block!important;padding:20px 0;break-before:page;}
    #p-summary{break-before:auto;}
    .notices,.foot{padding:12px 0;}
    .table-wrap{overflow:visible;}
    table{font-size:11px;} table.itemization{min-width:0;} th,td{white-space:normal;}
    tr,.box{break-inside:avoid;}
    thead{display:table-header-group;}
  }
</style>
</head>
<body>
<p>Report markup and accessible tab navigation are generated by scripts/lib/render.js.</p>
</body>
</html>
